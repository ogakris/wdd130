    <main>
        <section class="company-info">
            <h2>Contact information</h2>
            <div class="contact-details">
                <p>122 Guggisberg Avenue, Accra</p>
                <p>(233) 263740612</p>
                <p>info@whitewater.com</p>
            </div>
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3971.2155208742597!2d-0.24610882435627532!3d5.535018933858951!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdf971601d40ef7%3A0xad289f11ac6df859!2sGuggisberg%20Ave%2C%20Accra!5e0!3m2!1sen!2sgh!4v1770509253484!5m2!1sen!2sgh"

                  referrerpolicy="no-referrer-when-downgrade"></iframe>>
            </div>
        </section>
        <section class=" employee-profiles">
            <h2>We are here to serve You!</h2>
            <div class="profile-grid">
                <figure>
                    <img src="..//wwr/images/Kwesi Wusu.jpeg" alt="Kwesi Wusu">
                    <figcaption>Kwesi Wusu - Lead Supervisor</figcaption>
                </figure>
                <figure>
                    <img src="..//wwr/images/Bili Maru.jpeg" alt="Billy Maru">>
                    <figcaption> Billy Maru - Safety Cordinator</figcaption>
                </figure>
                <figure>
                    <img src="..//wwr/images/Bryan Cheampong.jpeg" alt="Bryan">
                    <figcaption>Bryan Cheampong - Organizer</figcaption>
                </figure>

            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a message</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </form>

        </section>
    </main>
